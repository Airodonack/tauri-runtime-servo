# Formatting, lints, tests and the example's build, on Ubuntu, headless;
# then the example run headless as a smoke test (the `smoke` job).
#
# The crate depends on the Servo fork by path (../../servo from the crate),
# so the job checks the two repositories out side by side in that layout.
# Stylo is a git dependency (the [patch."https://github.com/servo/stylo"] block of Cargo.toml), which
# cargo fetches itself: no checkout.
name: check

on:
  push:
    branches: [main]
  pull_request:

env:
  SERVO_REPOSITORY: Airodonack/servo
  SERVO_REF: vodscribe/main
  CARGO_TERM_COLOR: always
  CC: clang
  CXX: clang++

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: tauri-servo/tauri-runtime-servo
    steps:
      - name: Check out the runtime
        uses: actions/checkout@v4
        with:
          path: tauri-servo/tauri-runtime-servo
      - name: Check out the Servo fork
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SERVO_REPOSITORY }}
          ref: ${{ env.SERVO_REF }}
          path: servo
          fetch-depth: 1

      # Servo's build is large: make room on the runner first.
      - name: Free disk space
        working-directory: .
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # Servo's own list (python/servo/platform/linux_packages/apt), plus
      # GTK 3 for tao, WebKitGTK's development files (tauri and
      # tauri-runtime depend on webkit2gtk on Linux whatever the runtime;
      # nothing of it is linked) and Xvfb with Mesa for headless runs.
      - name: Install system packages
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates clang cmake curl g++ git gperf llvm-dev m4 \
            libdbus-1-dev libfreetype6-dev libharfbuzz-dev liblzma-dev libudev-dev libunwind-dev \
            libgl1-mesa-dri libgles2-mesa-dev libegl1-mesa-dev libvulkan1 mesa-vulkan-drivers \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxmu-dev libxmu6 \
            libxkbcommon0 libxkbcommon-x11-0 xorg-dev xvfb \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            libgstrtspserver-1.0-dev libges-1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-tools

      # One LLVM for the C++ parts of Servo and for bindgen. The image's own
      # clang comes in three versions, and bindgen's libclang must match the
      # headers it parses: with the 26.04 image mozangle's bindings failed on
      # clang 21's intrinsics headers ("use of undeclared identifier
      # '__builtin_ia32_sqrtss'"). Servo's own CI pins the same release.
      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20.1"
          directory: ${{ runner.temp }}/llvm
      - name: Point bindgen at that LLVM
        run: echo "LIBCLANG_PATH=${LLVM_PATH}/lib" >> "$GITHUB_ENV"

      # rust-toolchain.toml names the toolchain; rustup installs it on first use.
      - name: Show the toolchain
        run: rustup show active-toolchain && cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-servo/tauri-runtime-servo

      # -p for each package: `--all` would format the path dependencies (the
      # whole Servo fork) in this workspace's style.
      - name: Formatting
        run: cargo fmt -p tauri-runtime-servo -p helloworld -p menubar -- --check

      # Everything in the release profile, so Servo is compiled once for the
      # tests and both builds of the example (a debug Servo is a second
      # full build).
      - name: Lints
        run: cargo clippy --release --workspace --all-targets --all-features -- -D warnings

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --release --no-deps -p tauri-runtime-servo

      # The ignored tests need an X display (one GTK start per process);
      # Xvfb gives them one.
      - name: Tests
        run: xvfb-run -a cargo test --release -p tauri-runtime-servo -- --include-ignored

      # Copied at once: the next two builds write the same path.
      - name: The example
        run: |
          cargo build --release -p helloworld
          mkdir -p smoke && cp target/release/helloworld smoke/helloworld

      - name: Keep the example for the smoke test
        uses: actions/upload-artifact@v4
        with:
          name: helloworld
          path: tauri-servo/tauri-runtime-servo/smoke/helloworld
          retention-days: 7

      - name: The example in production mode
        run: cargo build --release -p helloworld --features custom-protocol

      - name: The example with WebDriver
        run: cargo build --release -p helloworld --features tauri-runtime-servo/webdriver

  # The libservo canary: the example built above, run headless on its own
  # Xvfb display until it closes itself; it fails if any RESULT line of
  # examples/helloworld/expected-results.txt is missing or the app does not
  # exit with status 0. On a runner of its own, the binary runs away from
  # the tree it was built in, as an app's would.
  smoke:
    needs: check
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out the runtime
        uses: actions/checkout@v4

      # The check job's list: its development packages bring every library
      # the binary links (a runtime-only list would be a second list to keep
      # in step with the build's), Mesa for software rendering, GStreamer's
      # plugins and Xvfb.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates clang cmake curl g++ git gperf llvm-dev m4 \
            libdbus-1-dev libfreetype6-dev libharfbuzz-dev liblzma-dev libudev-dev libunwind-dev \
            libgl1-mesa-dri libgles2-mesa-dev libegl1-mesa-dev libvulkan1 mesa-vulkan-drivers \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxmu-dev libxmu6 \
            libxkbcommon0 libxkbcommon-x11-0 xorg-dev xvfb \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            libgstrtspserver-1.0-dev libges-1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-tools

      - name: Fetch the example
        uses: actions/download-artifact@v4
        with:
          name: helloworld
          path: smoke

      # Artifacts lose the executable bit.
      - name: Run it headless
        run: |
          chmod +x smoke/helloworld
          bash examples/helloworld/smoke-test.sh smoke/helloworld
