[workspace]
resolver = "2"
members = [".", "examples/helloworld", "examples/menubar"]

# The fork's layout reads style properties (`scrollbar-width`,
# `scrollbar-color`, `scrollbar-gutter`, `accent-color`, `text-overflow`)
# that stock Stylo 0.22.0 leaves out of Servo's style structs: the fork's own
# `[patch.crates-io]` swaps in the stylo fork (branch
# vodscribe/v0.22.0 of Airodonack/stylo), but a [patch] applies only from the workspace a
# build starts in, so this workspace, and any app that depends on this crate,
# needs the same block. Every crate of Stylo's workspace is patched together,
# or two copies of the shared ones get built.
[patch.crates-io]
selectors = { git = "https://github.com/Airodonack/stylo", rev = "b5c009c00c159d11d9c01f4c01957f4b2290b767" }
servo_arc = { git = "https://github.com/Airodonack/stylo", rev = "b5c009c00c159d11d9c01f4c01957f4b2290b767" }
stylo = { git = "https://github.com/Airodonack/stylo", rev = "b5c009c00c159d11d9c01f4c01957f4b2290b767" }
stylo_atoms = { git = "https://github.com/Airodonack/stylo", rev = "b5c009c00c159d11d9c01f4c01957f4b2290b767" }
stylo_derive = { git = "https://github.com/Airodonack/stylo", rev = "b5c009c00c159d11d9c01f4c01957f4b2290b767" }
stylo_dom = { git = "https://github.com/Airodonack/stylo", rev = "b5c009c00c159d11d9c01f4c01957f4b2290b767" }
stylo_malloc_size_of = { git = "https://github.com/Airodonack/stylo", rev = "b5c009c00c159d11d9c01f4c01957f4b2290b767" }
stylo_static_prefs = { git = "https://github.com/Airodonack/stylo", rev = "b5c009c00c159d11d9c01f4c01957f4b2290b767" }
stylo_traits = { git = "https://github.com/Airodonack/stylo", rev = "b5c009c00c159d11d9c01f4c01957f4b2290b767" }
to_shmem = { git = "https://github.com/Airodonack/stylo", rev = "b5c009c00c159d11d9c01f4c01957f4b2290b767" }
to_shmem_derive = { git = "https://github.com/Airodonack/stylo", rev = "b5c009c00c159d11d9c01f4c01957f4b2290b767" }

[package]
name = "tauri-runtime-servo"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "A Tauri runtime that draws the app's windows with the Servo web engine instead of wry"
repository = "https://github.com/Airodonack/tauri-runtime-servo"
homepage = "https://github.com/Airodonack/tauri-runtime-servo"
readme = "README.md"
keywords = ["tauri", "servo", "runtime", "webview", "gui"]
categories = ["gui", "web-programming"]
# The window, monitor and dispatcher plumbing is adapted from tauri-runtime-wry
# (Apache-2.0 OR MIT, see NOTICE); the input conversion follows servoshell
# (MPL-2.0).
license = "Apache-2.0 OR MIT"
# Not on crates.io yet: libservo and the Stylo branch are path dependencies.
publish = false

[dependencies]
# The runtime trait is "not stable": bumped together and deliberately, at
# the minor version tauri-runtime-wry 2.12 pins (`~`), so a consumer still
# takes Tauri's patch releases.
# tauri-runtime's devtools methods exist on the trait only with its `devtools`
# feature (or debug assertions in tauri-runtime's own build). This crate
# always turns the feature on and implements them in every profile, so the
# trait and the impl agree whatever profile or tool builds the two crates
# (rustdoc builds this crate with debug assertions against a release
# tauri-runtime without them). An app that also has tauri-runtime-wry in its
# graph without wry's `devtools` feature will fail to build: the two runtimes
# are not meant to share a binary.
tauri-runtime = { version = "~2.12.1", features = ["devtools"] }
tauri-utils = "~2.10.2"
tao = { version = "~0.37.1", default-features = false, features = ["rwh_06", "x11", "dbus"] }
raw-window-handle = "0.6"
dpi = "0.1"
euclid = "0.22"
http = "1"
url = "2"
log = "0.4"
# The fork's libservo with servoshell's web features and the GStreamer media stack.
servo = { path = "../../servo/components/servo", default-features = false, features = [
    "bundled",
    "clipboard",
    "js_jit",
    "multiprocess",
    "default_web_features",
    "gamepad",
    "media-gstreamer",
] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
# What a protocol handler needs to read a request body: libservo hands over
# net's `Request`, whose body arrives over Servo's IPC channels.
net_traits = { package = "servo-net-traits", path = "../../servo/components/shared/net" }
ipc-channel = "0.23"
parking_lot = "0.12"
tokio = { version = "1", default-features = false, features = ["sync"] }
serde_json = "1"
# Servo's WebDriver server, for end-to-end tests (the `webdriver` feature):
# not part of libservo, so the embedder starts it and answers its commands.
webdriver_server = { package = "servo-webdriver-server", path = "../../servo/components/webdriver_server", optional = true }
# The channel the server's commands arrive on (the type in Servo's API).
crossbeam-channel = "0.5"

[dev-dependencies]
# A `WebViewId` for the routing tests (libservo re-exports the type, not
# its test constant). Already part of the build through libservo.
servo_base = { package = "servo-base", path = "../../servo/components/shared/base" }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18.2", features = ["v3_24"] }
gdkx11 = "0.18.2"
x11-dl = "2.21"
# To ask EGL which X visual its config names before the child window is made.
khronos-egl = { version = "6", features = ["dynamic"] }

[features]
# Servo's WebDriver server, started when TAURI_RUNTIME_SERVO_WEBDRIVER_PORT
# names a port. Test builds only: it listens on 127.0.0.1, where any local
# program can reach it, and runs any script it is sent.
webdriver = ["dep:webdriver_server"]
