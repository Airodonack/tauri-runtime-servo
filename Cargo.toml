[workspace]
resolver = "2"
members = [".", "examples/helloworld", "examples/menubar"]

# The fork's layout reads style properties (`scrollbar-gutter`,
# `accent-color`) that the Stylo Servo pins leaves out of Servo's style
# structs: the fork's own `[patch."https://github.com/servo/stylo"]` swaps in
# the stylo fork (branch vodscribe/main of Airodonack/stylo; Servo takes Stylo
# from git, so the patch names that source), but a [patch] applies only from
# the workspace a build starts in, so this workspace, and any app that depends
# on this crate, needs the same block. Every crate of Stylo's workspace is
# patched together, or two copies of the shared ones get built.
[patch."https://github.com/servo/stylo"]
selectors = { git = "https://github.com/Airodonack/stylo", rev = "eb9f6ae0500f2415fd9dd224780a55094ef3be18" }
servo_arc = { git = "https://github.com/Airodonack/stylo", rev = "eb9f6ae0500f2415fd9dd224780a55094ef3be18" }
stylo = { git = "https://github.com/Airodonack/stylo", rev = "eb9f6ae0500f2415fd9dd224780a55094ef3be18" }
stylo_atoms = { git = "https://github.com/Airodonack/stylo", rev = "eb9f6ae0500f2415fd9dd224780a55094ef3be18" }
stylo_derive = { git = "https://github.com/Airodonack/stylo", rev = "eb9f6ae0500f2415fd9dd224780a55094ef3be18" }
stylo_dom = { git = "https://github.com/Airodonack/stylo", rev = "eb9f6ae0500f2415fd9dd224780a55094ef3be18" }
stylo_malloc_size_of = { git = "https://github.com/Airodonack/stylo", rev = "eb9f6ae0500f2415fd9dd224780a55094ef3be18" }
stylo_static_prefs = { git = "https://github.com/Airodonack/stylo", rev = "eb9f6ae0500f2415fd9dd224780a55094ef3be18" }
stylo_traits = { git = "https://github.com/Airodonack/stylo", rev = "eb9f6ae0500f2415fd9dd224780a55094ef3be18" }
to_shmem = { git = "https://github.com/Airodonack/stylo", rev = "eb9f6ae0500f2415fd9dd224780a55094ef3be18" }
to_shmem_derive = { git = "https://github.com/Airodonack/stylo", rev = "eb9f6ae0500f2415fd9dd224780a55094ef3be18" }

[package]
name = "tauri-runtime-servo"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A Tauri runtime that draws the app's windows with the Servo web engine instead of wry"
repository = "https://github.com/Airodonack/tauri-runtime-servo"
homepage = "https://github.com/Airodonack/tauri-runtime-servo"
readme = "README.md"
keywords = ["tauri", "servo", "runtime", "webview", "gui"]
categories = ["gui", "web-programming"]
# The window, monitor and dispatcher plumbing is adapted from tauri-runtime-wry
# (Apache-2.0 OR MIT, see NOTICE).
license = "Apache-2.0 OR MIT"
# Not on crates.io: libservo and the Stylo branch are git dependencies.
publish = false

[dependencies]
# The runtime trait is "not stable": bumped together and deliberately, at
# the minor version tauri-runtime-wry 2.12 pins (`~`), so a consumer still
# takes Tauri's patch releases.
# tauri-runtime's devtools methods exist on the trait only with its `devtools`
# feature (or debug assertions in tauri-runtime's own build). This crate
# always turns the feature on and implements them in every profile, so the
# trait and the impl agree whatever profile or tool builds the two crates
# (rustdoc builds this crate with debug assertions against a release
# tauri-runtime without them). An app that also has tauri-runtime-wry in its
# graph without wry's `devtools` feature will fail to build: the two runtimes
# are not meant to share a binary.
tauri-runtime = { version = "~2.12.1", features = ["devtools"] }
tauri-utils = "~2.10.2"
tao = { version = "~0.37.1", default-features = false, features = ["rwh_06", "x11", "dbus"] }
raw-window-handle = "0.6"
dpi = "0.1"
euclid = "0.22"
http = "1"
url = "2"
log = "0.4"
# The fork's libservo with its default web features, gamepads and the GStreamer
# media stack with Media Source Extensions.
# The fork comes from GitHub, pinned by revision; the Stylo patch above is
# the one that revision's Cargo.toml has, and every Servo crate named here
# takes the same revision. An app with local checkouts points them at its
# own with `[patch."https://github.com/Airodonack/servo"]`.
servo = { git = "https://github.com/Airodonack/servo", rev = "937da10c88ed5d79411a0f1fd14e8da1ac860d99", default-features = false, features = [
    "bundled",
    "clipboard",
    "js_jit",
    "multiprocess",
    "default_web_features",
    "gamepad",
    "media-gstreamer",
    "media-gstreamer-mse",
] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
# What a protocol handler needs to read a request body: libservo hands over
# net's `Request`, whose body arrives over Servo's IPC channels.
net_traits = { package = "servo-net-traits", git = "https://github.com/Airodonack/servo", rev = "937da10c88ed5d79411a0f1fd14e8da1ac860d99" }
ipc-channel = "0.23"
parking_lot = "0.12"
tokio = { version = "1", default-features = false, features = ["sync"] }
serde_json = "1"
# Servo's WebDriver server, for end-to-end tests (the `webdriver` feature):
# not part of libservo, so the embedder starts it and answers its commands.
webdriver_server = { package = "servo-webdriver-server", git = "https://github.com/Airodonack/servo", rev = "937da10c88ed5d79411a0f1fd14e8da1ac860d99", optional = true }
# The channel the server's commands arrive on (the type in Servo's API).
crossbeam-channel = "0.5"

[dev-dependencies]
# libservo's JSValue::Object is an IndexMap: the unit tests build one.
indexmap = "2"
# A `WebViewId` for the routing tests (libservo re-exports the type, not
# its test constant). Already part of the build through libservo.
servo_base = { package = "servo-base", git = "https://github.com/Airodonack/servo", rev = "937da10c88ed5d79411a0f1fd14e8da1ac860d99" }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18.2", features = ["v3_24"] }
gdkx11 = "0.18.2"
x11-dl = "2.21"
# To ask EGL which X visual its config names before the child window is made.
khronos-egl = { version = "6", features = ["dynamic"] }

[features]
# Servo's WebDriver server, started when TAURI_RUNTIME_SERVO_WEBDRIVER_PORT
# names a port. Test builds only: it listens on 127.0.0.1, where any local
# program can reach it, and runs any script it is sent.
webdriver = ["dep:webdriver_server"]
